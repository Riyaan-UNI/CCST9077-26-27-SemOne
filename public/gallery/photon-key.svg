<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="Photons carrying a key">
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="rgba(57,255,20,0.10)" stroke-width="1"/>
  </pattern>
  <radialGradient id="vign" cx="50%" cy="45%" r="72%">
    <stop offset="0%" stop-color="#39ff14" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#070b09" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
    <stop offset="50%" stop-color="#5be3ff" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
  </linearGradient>
</defs>
