<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">The Unfiled Singularity</title>
  <desc id="desc">An original cosmic comic-book illustration. A black hole bends starlight into bright rings. A tiny astronaut stretches toward it, green and gold time branches fork overhead, and a tiny Qubi-like monitor glows among fictional redacted secrets inside the dark center.</desc>
  <defs>
    <radialGradient id="space" cx="52%" cy="48%" r="72%">
      <stop offset="0" stop-color="#17203d"/>
      <stop offset=".55" stop-color="#0b1021"/>
      <stop offset="1" stop-color="#050711"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a93f73" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#432c75" stop-opacity=".28"/>
      <stop offset="1" stop-color="#12172f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2=".28">
      <stop offset="0" stop-color="#ff5c53"/>
      <stop offset=".2" stop-color="#ffbe69"/>
      <stop offset=".43" stop-color="#fff0be"/>
      <stop offset=".62" stop-color="#9ce4ff"/>
      <stop offset=".82" stop-color="#b18cff"/>
      <stop offset="1" stop-color="#ff6a7e"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75dfff"/>
      <stop offset=".46" stop-color="#faf2d4"/>
      <stop offset=".75" stop-color="#ffb85e"/>
      <stop offset="1" stop-color="#f26b92"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b4e583"/>
      <stop offset=".52" stop-color="#f4d77b"/>
      <stop offset="1" stop-color="#8ce0ba"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff8ff"/>
      <stop offset="1" stop-color="#9baac7"/>
    </linearGradient>
    <radialGradient id="horizon" cx="49%" cy="45%" r="55%">
      <stop offset="0" stop-color="#000108"/>
      <stop offset=".78" stop-color="#03040c"/>
      <stop offset=".91" stop-color="#080a19"/>
      <stop offset="1" stop-color="#1c1830"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="halftone" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d9d9ff" opacity=".14"/>
    </pattern>
    <clipPath id="frame"><rect x="22" y="22" width="1156" height="856" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#space)"/>
    <ellipse cx="260" cy="620" rx="340" ry="265" fill="url(#nebula)"/>
    <ellipse cx="1004" cy="288" rx="300" ry="220" fill="url(#nebula)" opacity=".75"/>
    <rect width="1200" height="900" fill="url(#halftone)"/>

    <!-- distant stars and thin comic-panel speed marks -->
    <g fill="#dff6ff">
      <circle cx="77" cy="123" r="2"/><circle cx="161" cy="253" r="1.6"/><circle cx="1080" cy="114" r="2"/>
      <circle cx="1089" cy="645" r="1.8"/><circle cx="158" cy="737" r="2"/><circle cx="1003" cy="760" r="1.4"/>
      <circle cx="274" cy="112" r="1.2"/><circle cx="944" cy="175" r="1.4"/><circle cx="1100" cy="422" r="1.2"/>
      <circle cx="94" cy="496" r="1.5"/><circle cx="365" cy="780" r="1.1"/><circle cx="844" cy="791" r="1.5"/>
      <circle cx="447" cy="180" r="1.2"/><circle cx="779" cy="108" r="1.5"/><circle cx="115" cy="350" r="1.2"/>
      <circle cx="1035" cy="523" r="1.4"/><circle cx="887" cy="682" r="1.1"/><circle cx="328" cy="602" r="1.3"/>
    </g>
    <g stroke="#8dddf5" stroke-width="1" opacity=".28">
      <path d="M65 195h92M110 211h42M1028 199h96M1067 216h54M81 663h72M1020 699h112"/>
      <path d="M241 52l-20 46M958 55l-28 56M1092 310l-38 26M160 558l-34 28"/>
    </g>

    <!-- an eerie nebula face: only two uncertain glints, never a literal monster -->
    <g opacity=".38" fill="none" stroke="#db7189" stroke-linecap="round">
      <path d="M130 486c24-43 82-63 127-37 30 18 39 58 17 87-18 24-52 37-78 26-27-11-38-39-27-60 9-18 33-24 47-11" stroke-width="3" opacity=".32"/>
      <path d="M178 492l15 4M222 478l14-5" stroke-width="5" opacity=".52"/>
      <path d="M150 533c19 8 39 7 55-2" stroke-width="2" opacity=".4"/>
    </g>

    <!-- diverging time branches: an abstract superhero-time-story nod -->
    <g fill="none" stroke="url(#branch)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M108 162C262 134 365 159 455 215s125 78 205 71c75-7 114-48 169-80 62-36 128-51 249-41" stroke-width="4" opacity=".84"/>
      <path d="M414 191c-13-48-49-81-98-111M424 198c39-45 48-83 42-129M642 286c-12 61-5 96 32 143M711 275c64 32 94 70 110 118M823 207c8-51 43-89 96-115" stroke-width="2.2" opacity=".62"/>
      <path d="M247 143c-5-34-19-58-44-79M877 198c52 16 85 42 110 78M306 151c33-20 50-43 57-72" stroke-width="1.4" opacity=".5"/>
    </g>
    <g fill="#d5edaa" stroke="#16221b" stroke-width="3">
      <circle cx="423" cy="198" r="7"/><circle cx="646" cy="284" r="7"/><circle cx="821" cy="208" r="7"/>
    </g>
    <g transform="translate(1008 128)" stroke="#e2cf84" stroke-width="3" fill="none" opacity=".78">
      <path d="M0 0h48M0 42h48M8 4c0 13 8 17 16 17S40 17 40 4M8 38c0-13 8-17 16-17s16 4 16 17"/>
      <circle cx="24" cy="21" r="3" fill="#e2cf84"/>
    </g>
    <g fill="#d9eab9" font-family="monospace" font-size="12" letter-spacing="2" opacity=".78">
      <text x="87" y="139">TEMPORAL TRACE / BRANCH 07</text>
      <text x="1010" y="190">UNFILED</text>
    </g>

    <!-- distorted background starlight: warped paths loop over and under the shadow -->
    <ellipse cx="604" cy="472" rx="264" ry="206" fill="none" stroke="#5fbfe7" stroke-width="25" opacity=".12" filter="url(#softGlow)"/>
    <path d="M265 423C364 319 430 300 513 321c73 18 134 18 202-2 91-27 168-6 223 93" fill="none" stroke="url(#lens)" stroke-width="4" opacity=".83" filter="url(#glow)"/>
    <path d="M299 567c78 91 160 112 245 82 75-26 140-26 217 5 72 29 132 4 180-56" fill="none" stroke="url(#lens)" stroke-width="3" opacity=".78" filter="url(#glow)"/>
    <path d="M380 307C445 356 473 400 473 465s-27 108-82 157" fill="none" stroke="#d5efff" stroke-width="1.5" opacity=".45"/>
    <path d="M834 315c-61 47-88 98-84 157 4 58 35 104 94 146" fill="none" stroke="#ffbd85" stroke-width="1.6" opacity=".53"/>

    <!-- luminous accretion disk, partially hidden behind the shadow -->
    <ellipse cx="604" cy="470" rx="353" ry="100" transform="rotate(-13 604 470)" fill="none" stroke="#f4686d" stroke-width="52" opacity=".13" filter="url(#softGlow)"/>
    <ellipse cx="604" cy="470" rx="343" ry="87" transform="rotate(-13 604 470)" fill="none" stroke="url(#disk)" stroke-width="24" opacity=".78" filter="url(#glow)"/>
    <ellipse cx="604" cy="470" rx="317" ry="69" transform="rotate(-13 604 470)" fill="none" stroke="#fff1c8" stroke-width="4" opacity=".83"/>
    <ellipse cx="604" cy="470" rx="369" ry="113" transform="rotate(-13 604 470)" fill="none" stroke="#a4d9ff" stroke-width="2" opacity=".48"/>
    <path d="M264 384c77-54 146-61 213-33M731 585c70 21 127 7 182-41" fill="none" stroke="#fff9e8" stroke-width="4" opacity=".8" filter="url(#glow)"/>

    <!-- shadow / event horizon -->
    <circle cx="604" cy="470" r="151" fill="#05060b" stroke="#100f1d" stroke-width="9"/>
    <circle cx="604" cy="470" r="139" fill="url(#horizon)" stroke="#28233e" stroke-width="2"/>
    <circle cx="604" cy="470" r="133" fill="none" stroke="#dfd8ff" stroke-width="1" stroke-dasharray="2 9" opacity=".36"/>

    <!-- fictional secrets at the singularity: a tiny Qubi-like archive terminal -->
    <g opacity=".78" filter="url(#glow)">
      <path d="M564 448l23-19 17 13-14 17-23 4zM634 441l18 17-8 20-20-7zM582 497l17-12 12 21-20 9z" fill="#f1c876" opacity=".68"/>
      <path d="M580 459h46l-5 33h-36z" fill="#111d32" stroke="#a8dff0" stroke-width="2"/>
      <path d="M586 465h34v20h-34z" fill="#0b0912" stroke="#d5aa6e" stroke-width="1.4"/>
      <circle cx="596" cy="475" r="2.4" fill="#eff4c7"/><circle cx="610" cy="475" r="2.4" fill="#eff4c7"/>
      <path d="M595 482q8 5 16 0" fill="none" stroke="#f2ab75" stroke-width="1.8"/>
      <path d="M598 493v6m10-6v6m-17 0h35" stroke="#a8dff0" stroke-width="2"/>
    </g>
    <g fill="#f5e7c5" font-family="monospace" font-size="10" letter-spacing="1.6" opacity=".68">
      <text x="530" y="541">FILE 00 / UNKNOWN</text>
    </g>
    <path d="M604 452v-35m0 107v34" stroke="#f2c46f" stroke-width="1.5" stroke-dasharray="3 5" opacity=".38"/>

    <!-- tiny incoming explorer stretched along the radial direction -->
    <g transform="translate(842 300) rotate(84)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-63 0h30" stroke="#f3a56e" stroke-width="2" opacity=".75"/>
      <path d="M-47 -9h22m-14-7h25m-38 32h30" stroke="#f6c27c" stroke-width="1.3" opacity=".62"/>
      <path d="M-22 0c6-11 13-16 22-16 9 0 16 5 22 16-6 11-13 16-22 16-9 0-16-5-22-16z" fill="url(#suit)" stroke="#29374f" stroke-width="3"/>
      <circle cx="0" cy="-27" r="13" fill="url(#suit)" stroke="#35425a" stroke-width="3"/>
      <path d="M-10-30q10-8 19 2" fill="none" stroke="#6dd9ef" stroke-width="3"/>
      <path d="M-3-13l-17-12m23 12 17-14m-12 28 14 15m-23-14-16 18" fill="none" stroke="#c9d5e8" stroke-width="5"/>
      <path d="M-2 12v15m6-15v17" stroke="#f6c27c" stroke-width="1.4" opacity=".8"/>
    </g>
    <path d="M824 321C788 354 767 382 747 415" fill="none" stroke="#f5c67b" stroke-width="2" stroke-dasharray="4 7" opacity=".68"/>
    <path d="M824 321L744 416" stroke="#ff7e67" stroke-width="1" opacity=".32"/>
    <g transform="translate(898 348)">
      <path d="M0 31h-46l-43 30" fill="none" stroke="#f1b979" stroke-width="1.5"/>
      <rect x="-3" y="0" width="188" height="43" rx="3" fill="#101524" stroke="#a26d78" stroke-width="1.2" opacity=".9"/>
      <text x="9" y="18" fill="#f5c9a3" font-family="monospace" font-size="10" letter-spacing="1.3">TIDAL STRETCH</text>
      <text x="9" y="33" fill="#c4c6d5" font-family="sans-serif" font-size="10">a fictional falling explorer</text>
    </g>

    <!-- faint, uneasy shadow in the far side of the disk -->
    <g fill="none" stroke="#e3a1ae" stroke-width="2" opacity=".36">
      <path d="M398 473c18-20 44-20 62 0-18 20-44 20-62 0z"/>
      <circle cx="429" cy="473" r="5" fill="#e7bac0" stroke="none"/>
    </g>

    <!-- archive marks and comic-cover typography -->
    <path d="M61 797h1078M61 91h177M1024 91h115" stroke="#60718f" stroke-width="1" opacity=".55"/>
    <g fill="#ebedf8" font-family="monospace" letter-spacing="2">
      <text x="66" y="75" font-size="13" fill="#94d9e7">BUREAU FIELD JOURNAL / SPECULATIVE PLATE</text>
      <text x="1138" y="75" font-size="12" text-anchor="end" fill="#e9ae75">NO. 07 · CLASSIFIED</text>
      <text x="68" y="840" font-size="22" font-weight="700">THE UNFILED SINGULARITY</text>
      <text x="69" y="864" font-size="11" fill="#a8aec7">LIGHT BENDS. TIME BRANCHES. ONE LAST FILE REMAINS.</text>
      <text x="1137" y="850" font-size="10" text-anchor="end" fill="#92a0b9">FICTION / COSMIC CASE STUDY</text>
    </g>
    <g fill="none" stroke="#87ccdf" stroke-width="2" opacity=".72">
      <path d="M66 105h15v15M1134 105h-15v15M66 779h15v-15M1134 779h-15v-15"/>
      <path d="M82 740h25m-25 7h17M1097 740h25m-25 7h17"/>
    </g>
  </g>
  <rect x="22" y="22" width="1156" height="856" rx="4" fill="none" stroke="#8393ad" stroke-width="2" opacity=".7"/>
</svg>
